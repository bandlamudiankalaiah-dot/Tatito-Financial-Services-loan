<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    (function () {
      var NativeWebSocket = window.WebSocket;
      if (!NativeWebSocket) return;
      function createMockViteSocket(url, protocols) {
        var target = new EventTarget();
        target.url = String(url || '');
        target.protocol = Array.isArray(protocols) ? (protocols[0] || 'vite-hmr') : (protocols || 'vite-hmr');
        target.readyState = 1;
        target.bufferedAmount = 0;
        target.extensions = '';
        target.binaryType = 'blob';
        target.send = function () {};
        target.close = function () { target.readyState = 3; };
        setTimeout(function () {
          try {
            var openEvt = new Event('open');
            if (typeof target.onopen === 'function') target.onopen(openEvt);
            target.dispatchEvent(openEvt);
            var msgEvt = new MessageEvent('message', { data: JSON.stringify({ type: 'connected' }) });
            if (typeof target.onmessage === 'function') target.onmessage(msgEvt);
            target.dispatchEvent(msgEvt);
          } catch (e) {}
        }, 10);
        return target;
      }
      var PatchedWebSocket = function (url, protocols) {
        var protoStr = Array.isArray(protocols) ? protocols.join(',') : String(protocols || '');
        if (protoStr.indexOf('vite-hmr') !== -1 || protoStr.indexOf('vite-ping') !== -1) {
          return createMockViteSocket(url, protocols);
        }
        return protocols !== undefined ? new NativeWebSocket(url, protocols) : new NativeWebSocket(url);
      };
      PatchedWebSocket.prototype = NativeWebSocket.prototype;
      PatchedWebSocket.CONNECTING = 0;
      PatchedWebSocket.OPEN = 1;
      PatchedWebSocket.CLOSING = 2;
      PatchedWebSocket.CLOSED = 3;
      window.WebSocket = PatchedWebSocket;
    })();
    (function () {
      try {
        var saved = localStorage.getItem('tatito_theme');
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var isDark = saved === 'dark' || (!saved && prefersDark);
        if (isDark) {
          document.documentElement.classList.add('dark');
          document.documentElement.setAttribute('data-theme', 'dark');
        } else {
          document.documentElement.classList.remove('dark');
          document.documentElement.setAttribute('data-theme', 'light');
        }
      } catch (e) {}
    })();
  </script>
  <title>Tatito Financial Services — Borrow, Invest, Trade</title>
